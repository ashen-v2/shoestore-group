 services: 
  
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    
    environment:
       DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/postgres}
       SECRET_KEY: ${SECRET_KEY:-supersecretkey}
       ALGORITHM: ${ALGORITHM:-HS256}
       ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
       STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_4eC39HqLyjWDarjtT1zdp7dc}
       STRIPE_WEB_HOOK_SECRET: ${STRIPE_WEB_HOOK_SECRET:-whsec_test_webhook_secret}
       MAIL_API_KEY: ${MAIL_API_KEY:-test_mail_api_key}
       ORIGINS: ${ORIGINS:-http://localhost:3000,http://localhost:8000}

    command:  /bin/sh -c "uvicorn main:app"

    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    
    ports:
      - 3000:3000
      - 5173:5173
    
    environment:
       VITE_API_URL : ${VITE_API_URL:-/}
       VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY:-pk_test_51N7g0pL1k6Z9}
    
    stdin_open: true   # equivalent to -i (interactive)
    tty: true

    command:  /bin/sh -c "npm run dev -- --host"

    depends_on:
      - backend
